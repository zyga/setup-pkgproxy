#
# The cheap checks, for every pull request and push: typecheck, unit tests,
# and that the committed dist/ is what the sources build to, since dist/ is
# what callers run.
name: Check
on:
  push:
    branches: [main, "releases/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check that dist/ is up to date
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "::error::dist/ is out of date: run npm run build and commit dist/" >&2
            exit 1
          fi
