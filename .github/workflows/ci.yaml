#
# Exercise the action, and the LXD/snapcraft setup the README documents, on
# GitHub-hosted runners, then save the package cache as the README says
# and check that a second job restores it, extended attributes included. A
# full run builds a snap on three runners, so it runs only for merges to
# main and to release branches (releases/v1), for release tags (v1.2.3 and
# the floating v1), where drift in the runner images (LXD preinstalled or
# not, the runner user's groups, LXD's version) matters, for pull requests
# that change this workflow or what it tests, and by hand from the Actions
# tab.
name: CI
on:
  push:
    branches: [main, "releases/**"]
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/ci.yaml
      - action.yaml
      - build.sh
      - start.sh
      - pkgproxy.service
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lxd:
    name: LXD and snapcraft (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Report the runner image
        run: |
          set -x
          cat /etc/os-release
          id
          getent group lxd || true
          snap list lxd || true

      - name: Set up pkgproxy
        id: pkgproxy
        uses: ./
        with:
          # Unique to this run and runner image: v1's keys are stable per
          # CPU arch, so two jobs on one arch, or another run, would share
          # them, and the warm job must find this job's cache.
          package-cache-key: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}

      # The steps below follow the README's LXD sections ("LXD access on
      # GitHub-hosted runners", lxd, lxd-remote, snapcraft) verbatim; keep
      # the two in sync.
      - name: Install and initialise LXD
        run: |
          snap list lxd >/dev/null 2>&1 || sudo snap install lxd
          sudo lxd waitready
          sudo lxc storage list --format csv | grep -q . || sudo lxd init --auto
          sudo usermod -aG lxd "$USER"
          snap list lxd

      - name: Point LXD's image remotes at pkgproxy
        env:
          ADDR: ${{ steps.pkgproxy.outputs.addr }}
        run: |
          sg lxd -c 'lxc remote list >/dev/null && pkgproxyctl setup lxd-remote -addr "$ADDR" | sh'

      - name: Point snapcraft's build containers at pkgproxy
        env:
          ADDR: ${{ steps.pkgproxy.outputs.addr }}
        run: |
          sg lxd -c 'pkgproxyctl setup snapcraft -addr "$ADDR" | sh'

      - name: Verify the pkgproxy LXC hooks are in the snapcraft profile
        run: |
          RAW_LXC=$(sg lxd -c 'lxc profile get default raw.lxc --project snapcraft')
          if ! printf '%s\n' "$RAW_LXC" | grep -q '^lxc.hook.pre-start = ' ||
             ! printf '%s\n' "$RAW_LXC" | grep -q '^lxc.hook.post-stop = '; then
            echo "::error::pkgproxy LXC hooks missing from the snapcraft project's default profile" >&2
            exit 1
          fi

      - name: Set up the standalone pkgproxy LXD profile
        env:
          ADDR: ${{ steps.pkgproxy.outputs.addr }}
        run: |
          sg lxd -c 'pkgproxyctl setup lxd -addr "$ADDR" | sh'
          RAW_LXC=$(sg lxd -c 'lxc profile get pkgproxy raw.lxc')
          if ! printf '%s\n' "$RAW_LXC" | grep -q '^lxc.hook.pre-start = '; then
            echo "::error::pkgproxy LXC hooks missing from the pkgproxy profile" >&2
            exit 1
          fi

      - name: Report what pkgproxy set up
        run: sg lxd -c 'pkgproxyctl setup status | sh'

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build a snap in an LXD container
        working-directory: tests/hello-snap
        run: sg lxd -c 'snapcraft pack --use-lxd --verbose'

      # pkgproxyctl stats lists only cache hits, and a fresh runner has none
      # yet, so read pkgproxy's access log instead: one "handled request"
      # line per request, with its handler and outcome.
      - name: Check that the build went through pkgproxy
        run: |
          sudo journalctl -u pkgproxy.service -o cat --no-pager |
            grep 'msg="handled request"' >"$RUNNER_TEMP/access.log" || true
          echo "Requests by handler and outcome:"
          grep -o -E 'handler=[a-z]+ outcome=[a-z]+' "$RUNNER_TEMP/access.log" | sort | uniq -c
          # The bridge address the snapcraft profile gives pkgproxy, as
          # 10.x.y.1; build containers come from the same /24.
          BRIDGE=$(sg lxd -c 'lxc network get lxdbr0 ipv4.address' | cut -d/ -f1)
          NET=${BRIDGE%.*}.
          fail=0
          expect() {
            if grep -E "$2" "$RUNNER_TEMP/access.log" | grep -q -F "$3"; then
              echo "ok: $1"
            else
              echo "::error::$1: no matching request in pkgproxy's access log" >&2
              fail=1
            fi
          }
          expect "LXD base image via pkgproxy" 'handler=lxd .*outcome=(fetched|hit|joined|revalidated)' 'craft-com.ubuntu.cloud-buildd'
          expect "staged apt package from the build container" 'url=http://[^ ]*/hello_[^ ]*\.deb .*handler=apt .*outcome=(fetched|hit|joined)' "remote_addr=$NET"
          expect "snaps from the build container" 'handler=snap .*outcome=(fetched|hit|joined|passthrough)' "remote_addr=$NET"
          exit "$fail"

      - name: Dump pkgproxy's log
        if: ${{ always() }}
        run: sudo journalctl -u pkgproxy.service --no-pager -n 300 || true

      # pkgproxy 0.12 keeps each cached file's metadata in a user.* extended
      # attribute, which the cache must keep: mark a file of the cache so
      # that the warm job can check the attribute came back.
      - name: Set an extended attribute in the cache for the warm job
        env:
          VALUE: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
        run: |
          echo probe | sudo tee /var/cache/pkgproxy/ci-xattr-probe >/dev/null
          sudo python3 -c 'import os, sys; os.setxattr(sys.argv[1], "user.setup-pkgproxy.ci", sys.argv[2].encode())' \
            /var/cache/pkgproxy/ci-xattr-probe "$VALUE"

      # The README's save steps, verbatim.
      - name: Prepare pkgproxy cache for saving
        if: always()
        shell: bash
        run: |
          sudo systemctl stop pkgproxy.service || true
          sudo chown -R "$USER:$USER" ${{ steps.pkgproxy.outputs.cache-dir }}

      - if: steps.pkgproxy.outputs.package-cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.pkgproxy.outputs.cache-dir }}
          key: ${{ steps.pkgproxy.outputs.package-cache-key-success }}

  # A second job must restore the cache an lxd job saved, exactly, with the
  # extended attribute it set.
  warm:
    name: Warm cache (${{ matrix.os }})
    needs: lxd
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up pkgproxy
        id: pkgproxy
        uses: ./
        with:
          package-cache-key: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}

      - name: Check that the lxd job's cache was restored
        env:
          HIT: ${{ steps.pkgproxy.outputs.package-cache-hit }}
        run: |
          echo "package-cache-hit: ${HIT:-}"
          [ "$HIT" = true ] || { echo "::error::the cache the lxd job saved was not restored" >&2; exit 1; }
          if [ -e /var/cache/pkgproxy-archive/cache.tar ]; then
            echo "::error::the restored archive was not removed once unpacked" >&2
            exit 1
          fi
          echo "ok: restored and unpacked"

      - name: Check that the cache kept its extended attributes
        env:
          WANT: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
        run: |
          got=$(sudo python3 -c 'import os, sys; print(os.getxattr(sys.argv[1], "user.setup-pkgproxy.ci").decode())' \
            /var/cache/pkgproxy/ci-xattr-probe) || got=
          echo "user.setup-pkgproxy.ci: ${got:-missing}"
          [ "$got" = "$WANT" ] || { echo "::error::the cache lost its extended attributes: expected $WANT" >&2; exit 1; }
          echo "ok: the extended attribute set by the lxd job came back"
