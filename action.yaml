name: Setup pkgproxy
description: >-
  Build and run pkgproxy: a caching proxy for apt, snap, Go modules, Docker
  Hub and LXD image traffic in CI, with its cache saved at the end of the job.
inputs:
  version:
    description: >-
      pkgproxy version to build: a Go module version string for
      gitlab.com/zygoon/pkgproxy/cmd/pkgproxy (e.g. a pseudo-version pinning an
      exact commit). Pinned, not @main, so proxy.golang.org can't serve a stale
      main snapshot. Defaults to this action's own pinned pkgproxy release, so
      callers normally omit this entirely; bumping the pin is a one-file
      change here (this default), not an edit in every caller.
    required: false
    default: v0.11.0
  go-version:
    description: >-
      Go toolchain used to build pkgproxy when the binary cache misses: taken
      from the runner's tool cache, or downloaded from go.dev and checked
      against its published SHA-256.
    required: false
    default: "1.27.1"
  addr:
    description: Address pkgproxy listens on for apt/snap/go and the LXD cert download.
    required: false
    default: ":3142"
  binary-cache-key:
    description: >-
      actions/cache key prefix for the built pkgproxy binary. The pinned
      version, Go version and CPU arch are appended automatically, so bumping
      any of them busts the cache with no manual key edit.
    required: false
    default: pkgproxy-bin
  package-cache-key:
    description: >-
      actions/cache key prefix for the pkgproxy payload cache: an archive of
      /var/cache/pkgproxy that keeps extended attributes. The main step
      restores the newest cache under <prefix>-<arch>-, and the post step, at
      the end of the job, saves the cache under a key unique to the job, when
      save-package-cache allows it and the job added to the cache. v1.2 and
      later save the same archive under the same default prefix, so their
      cache warms the first v2 run.
    required: false
    default: pkgproxy-cache-v4
  save-package-cache:
    description: >-
      Which runs save the package cache at the end of the job: default-branch
      (the default), always, or never. A run can restore only the caches of
      its own ref, its pull request's base branch and the default branch, so
      a cache saved by a pull request or feature branch helps only that ref's
      later runs, while taking as much of the repository's cache storage as
      the default branch's, which every run restores. With default-branch,
      the default branch keeps the one shared cache and other runs only read
      it. Whatever the setting, a job that added nothing to the cache saves
      nothing.
    required: false
    default: default-branch
  configure-host:
    description: >-
      Whether to point the host's apt and snapd at the proxy (pkgproxyctl setup
      apt/snap). Set false when only the LXD container/image caching is wanted.
    required: false
    default: "true"
outputs:
  addr:
    description: >-
      The address pkgproxy is listening on (the resolved addr input). Pass this to
      any later `pkgproxyctl setup ... -addr` call so the address lives in one
      place (this action's input default), not repeated as a literal.
  cache-dir:
    description: The pkgproxy payload cache directory.
  package-cache-restored-key:
    description: The key the package cache was restored from, or empty on a cold start.
  package-cache-key:
    description: >-
      The key the post step saves the package cache under, if the job adds to
      it; empty when save-package-cache does not let this run save.
branding:
  icon: package
  color: purple
runs:
  using: node24
  main: dist/main.mjs
  post: dist/post.mjs
  # Failed and cancelled jobs save too: whatever pkgproxy cached is valid,
  # and the next run would otherwise download it all again.
  post-if: always()
